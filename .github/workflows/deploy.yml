name: Deploy website to railway

on:
  workflow_run:
    workflows: ["Build"] # must match build.yml's name
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only after a successful build of a push to main, not of a pull request
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    environment: production
    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          # Deploy exactly the commit that was built, not whatever main is now
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        run: |
          bash <(curl -fsSL railway.com/install.sh) -y
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      # Railway builds the Dockerfile once; --ci streams that build log here
      # and fails this job if the build or deploy fails
      - name: Deploy to Railway
        run: railway up --ci --service ${{ secrets.SERVICE_NAME }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
