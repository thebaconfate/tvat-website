services:
  database:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Run in alphabetical order, only when the volume is first created
      - ./dev/postgres/initialize-postgres.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./dev/postgres/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

volumes:
  postgres_data:
